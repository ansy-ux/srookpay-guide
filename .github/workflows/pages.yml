# main 에 올라오면: 개인정보 점검 → 빌드 → GitHub Pages 배포
# 점검을 통과하지 못하면 사이트에 반영되지 않는다 (커밋 훅을 건너뛰고 올린 경우까지 막음).
name: 점검 후 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 개인정보 점검
        run: node tools/privacy-check.mjs --all
      - name: 빌드
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
